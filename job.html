<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h1>Job Application Form</h1>
        <fieldset>
            <legend>
                Personal Info
            </legend>
            <label for="">Full Name:</label><br>
            <input type="text"><br><br>
            <label for="">Email:</label><br>
            <input type="email"><br><br>
            <label for="">Phone:</label><br>
            <input type="number"><br><br>
        </fieldset>
        <fieldset>
            <legend>
                Application Details
            </legend>
            <label for="">Position Applying For:</label><br>
            <select name="" id="">
                <option value="">Developer</option>
                <option value="">Programmer</option>
                <option value="">Designer</option>
                <option value="">Manager</option>
            </select><br><br>
            <label for=""> Experience Level:</label><br><br>
            <input type="checkbox">Fresher <br>
            <input type="checkbox">1-3 years <br>
            <input type="checkbox">3+ years <br>
            <label for="">Upload resume (PDF only):</label><br><br>
            <input type="file"><br><br>
            <label for="">Cover Letter:</label><br>
            <textarea cols="11" rows="11" placeholder="Tell us why you're a great fit ...."></textarea><br><br>
            </fieldset>
            <button>Submit Application</button>
    </form>
</body>
</html>
