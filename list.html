<!DOCTYPE html>
<html>
    <head>
        <title>List</title>
    </head>
    <body>
        <h1>Ordered List</h1>
        <ol type="1">
            <li>Apple</li>
            <li>Mango</li>
        </ol>
        <h1>Unordered List</h1>
        <ul type="circle">
            <li>Apple</li>
            <li>Grape</li>
            <li>Mango</li>
        </ul>

        <h1>Nested List</h1>
        <ul>
            <li>fruits
                <ol>
                    <li>Apple</li>
                    <li>Orange</li>
                </ol>
            </li>
        </ul>
        <ol>
            <li>fruits
                <ul>
                    <li>Apple</li>
                    <li>Orange</li>
                </ul>
            </li>
        </ol>

        <h1>Description List</h1>
        <dl>
            <dt>HTML</dt>
            <dd>Hyper text markup language</dd>
        </dl>
    </body>
</html>
